[project]
name = "supplysense"
version = "2.0.0"
description = "Licitaciones de energía y O&G en México: convocatorias abiertas, ganadores y precios históricos de CFE, PEMEX y ComprasMX, cada registro con liga a su fuente oficial."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamín Esponda García" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1,<2",
    "httpx>=0.27,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://beg-lag.github.io/SupplySense/"
Repository = "https://github.com/BEG-lag/SupplySense"
Author = "https://pivotek.mx"

[project.scripts]
supplysense = "supplysense.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplysense"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]
