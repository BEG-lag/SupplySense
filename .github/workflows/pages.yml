name: Publicar sitio

# Genera los JSON desde data/, compila el sitio y lo publica en GitHub Pages. Corre tras cada
# actualización (los commits hechos con GITHUB_TOKEN no disparan otros workflows) y cuando
# cambian el código, las reglas o el sitio.
on:
  push:
    branches: [main]
    paths: ["src/**", "reglas/**", "web/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Recuperar archivos de ComprasMX
        uses: actions/cache/restore@v6
        with:
          path: .cache/raw
          key: comprasmx-raw-latest
          restore-keys: comprasmx-raw-
      - name: Bajar los que falten
        run: uv run --frozen supplysense descargar
      - name: Generar datos del sitio
        run: uv run --frozen supplysense build --out web/public/data
      - name: Compilar
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_reintento.outputs.page_url }}
    steps:
      # La API de artefactos a veces lista tarde el artefacto recién subido ("No artifacts named
      # github-pages were found") y Pages a veces responde "Deployment failed, try again later".
      # Se espera antes de desplegar y se reintenta una vez.
      - name: Esperar a que el artefacto quede registrado
        run: sleep 15
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_reintento
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
