name: Publicar sitio

# Genera los JSON desde data/, compila el sitio y lo publica en GitHub Pages. Corre tras cada
# actualización (los commits hechos con GITHUB_TOKEN no disparan otros workflows) y cuando
# cambian el código, las reglas o el sitio.
on:
  push:
    branches: [main]
    paths: ["src/**", "reglas/**", "web/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generar datos del sitio
        run: uv run --frozen supplysense build --out web/public/data
      - name: Compilar
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
