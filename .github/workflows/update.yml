name: Actualizar datos

# La Ciudad de México usa UTC-6 todo el año desde 2022 (sin horario de verano).
#   12:30 UTC = 06:30 en la CDMX.
# Cada fuente corre aislada: si una falla, se conserva lo último bueno. El workflow solo
# falla (y GitHub avisa por correo) cuando una fuente lleva 3 días o más sin leerse.
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      detalles:
        description: "Máximo de detalles de CFE a leer"
        default: "150"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Los archivos de ComprasMX (fotos completas del año) viven en la caché de Actions, no en git.
      - name: Recuperar archivos de ComprasMX
        uses: actions/cache/restore@v6
        with:
          path: .cache/raw
          key: comprasmx-raw-${{ github.run_id }}
          restore-keys: comprasmx-raw-

      - name: Leer fuentes oficiales
        run: uv run --frozen supplysense -v update --detalles "${{ inputs.detalles || '150' }}"

      - name: Guardar archivos de ComprasMX
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/raw
          key: comprasmx-raw-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validar el dataset
        run: uv run --frozen pytest -q tests/test_dataset.py

      - name: Commit si algo cambió
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en las fuentes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stats=$(uv run --frozen supplysense stats | head -1)
          git commit -m "chore(data): actualización $(date -u +%Y-%m-%d) (${stats})"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Avisar si una fuente lleva días fallando
        run: uv run --frozen supplysense check

  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
